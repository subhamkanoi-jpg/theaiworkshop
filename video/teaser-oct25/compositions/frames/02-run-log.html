      <script>
        // agent-progress-theater (checklist): rows arrive as events and each
        // badge flips from its number to a done check. Local time: 0–6.4s.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#f2-glow", { scale: 0.94 },
          { scale: 1.08, duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
        tl.fromTo("#f2-eyebrow", { opacity: 0, y: -16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
        tl.fromTo("#f2-card", { scale: 0.94, opacity: 0, y: 40 },
          { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
        // "Running" is diegetic — the machine is working. Finite: 12 half-cycles
        // of 0.45s from 0.6s end at 6.0s, before the scene fades.
        tl.fromTo("#f2-dot", { opacity: 1 },
          { opacity: 0.25, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 11 }, 0.6);

        gsap.utils.toArray("#f2-scene .f2-row").forEach((row, i) => {
          const at = 0.85 + i * 0.68;
          tl.fromTo(row, { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, at);
          // Number out, check in, at the same centre (scale-swap).
          tl.fromTo(row.querySelector(".f2-num"), { scale: 1, opacity: 1 },
            { scale: 0.4, opacity: 0, duration: 0.24, ease: "power2.in" }, at + 0.3);
          tl.fromTo(row.querySelector(".f2-done"), { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, at + 0.36);
        });

        tl.fromTo("#f2-cap", { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.0);
        tl.fromTo("#f2-scene", { opacity: 1 },
          { opacity: 0, duration: 0.3, ease: "power2.in" }, 6.1);
        window.__timelines["f2-run-log"] = tl;
      </script>
