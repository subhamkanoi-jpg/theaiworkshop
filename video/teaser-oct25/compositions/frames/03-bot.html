      <script>
        // agent-progress-theater (message thread): question → typing dots →
        // answer; an unknown question is handed to a person. Local time: 0–4.2s.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#f3-glow", { scale: 0.92 },
          { scale: 1.06, duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo("#f3-eyebrow", { opacity: 0, y: -16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
        tl.fromTo("#f3-chat", { scale: 0.95, opacity: 0, y: 36 },
          { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.2);
        tl.fromTo("#f3-cap", { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);

        const pop = (sel, at) =>
          tl.fromTo(sel, { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, at);

        // Typing dots: a finite pulse, killed the instant the reply lands.
        const typing = (wrap, from, until) => {
          tl.fromTo(wrap, { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, from);
          gsap.utils.toArray(wrap + " i").forEach((dot, i) => {
            tl.fromTo(dot, { opacity: 0.3 },
              { opacity: 1, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1 },
              from + 0.06 + i * 0.1);
          });
          tl.set(wrap, { opacity: 0 }, until);
        };

        pop("#f3-q1", 0.65);
        typing("#f3-t1", 1.05, 1.55);
        pop("#f3-a1", 1.55);
        pop("#f3-q2", 2.2);
        typing("#f3-t2", 2.6, 3.1);
        pop("#f3-a2", 3.1);
        tl.fromTo("#f3-hand", { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 3.45);
        tl.fromTo("#f3-scene", { opacity: 1 },
          { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.9);
        window.__timelines["f3-bot"] = tl;
      </script>
