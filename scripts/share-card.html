<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The AI Workshop — September invitation artwork</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&display=swap");
      :root {
        --paper: #faf8f5;
        --ink: #29221d;
        --brand: #b54732;
        --muted: #716a64;
        --surface: #fff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, sans-serif;
      }
      main {
        height: 630px;
        display: grid;
        grid-template-columns: 740px 460px;
      }
      .copy {
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 700;
      }
      .brand img {
        width: 42px;
        height: 42px;
      }
      .eyebrow {
        font-size: 16px;
        font-weight: 600;
        color: var(--brand);
      }
      h1 {
        margin: 16px 0;
        font:
          600 52px/1.06 Fraunces,
          Georgia,
          serif;
        letter-spacing: -1.5px;
      }
      .description {
        max-width: 610px;
        font-size: 23px;
        line-height: 1.5;
        margin: 16px 0;
        color: var(--muted);
      }
      .facts {
        font-size: 21px;
        line-height: 1.6;
        font-weight: 600;
      }
      .url {
        margin-top: 12px;
        color: var(--brand);
        font-size: 17px;
        font-weight: 600;
      }
      figure {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        display: flex;
        flex-direction: column;
      }
      .photo {
        width: 460px;
        height: 400px;
        object-fit: cover;
      }
      figcaption {
        padding: 30px;
        font-size: 25px;
        line-height: 1.4;
      }
      figcaption small {
        display: block;
        margin-top: 15px;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="copy">
        <div class="brand">
          <img src="/favicon.svg" alt="" />The AI Workshop
        </div>
        <div>
          <p class="eyebrow">NO CODE. REAL WORK. IN PERSON.</p>
          <h1>Build Your AI<br />Follow-up Assistant</h1>
          <p class="description">
            Rough notes → clear next steps<br />and a message you can review and
            send.
          </p>
        </div>
        <div>
          <div class="facts">
            Sunday, 27 September 2026<br />11 AM–2 PM · Salt Lake, Kolkata ·
            ₹799
          </div>
          <div class="url">theaiworkshop.in/workshop</div>
        </div>
      </div>
      <figure>
        <img
          class="photo"
          src="/meetup1/group-selfie.jpg"
          alt="Participants at the June 2026 AI Workshop"
        />
        <figcaption>
          One real project.<br />One useful Sunday.<small
            >For non-techie professionals & business owners.<br />Photo from our
            first workshop · June 2026</small
          >
        </figcaption>
      </figure>
    </main>
  </body>
</html>
